version:  "3.0"
services:
  
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    restart: always 
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension
    depends_on:
      - victoria-traces
      - victoria-logs
      - victoria-metrics 

  victoria-traces:
    image: victoriametrics/victoria-traces:v0.10.0
    restart: always
    command:
      - "--retentionPeriod=8w"
      - "--storageDataPath=/victoria-traces-data"
      - "--httpListenAddr=:10428"
      - "--servicegraph.enableTask=true"
    ports:
      - 10428:10428/tcp
    volumes:
      - ./volumes/victoria-traces-data:/victoria-traces-data

  victoria-logs:
    image: victoriametrics/victoria-logs:latest
    restart: always
    command:
      - "--retentionPeriod=8w"
      - "--storageDataPath=/victoria-logs-data"
      - "--httpListenAddr=:9428"
      - "--loggerLevel=INFO"
    ports:
      - 9428:9428/tcp
    volumes:
      - ./volumes/victoria-logs-data:/victoria-logs-data

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.144.0
    command:
      - "--retentionPeriod=8w"
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
      - "--opentelemetry.usePrometheusNaming=true"
      - "--enableMetadata=true"
    ports:
      - "8428:8428"
    volumes:
      - ./volumes/victoria-metrics-data:/victoria-metrics-data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0-24320339380
    restart: always
    ports:
      - 3000:3000/tcp
    volumes:
      - ./volumes/grafana-data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./dashboards:/var/lib/grafana/dashboards 
    depends_on:
      - otel-collector
    environment:
      GF_INSTALL_PLUGINS: "victoriametrics-metrics-datasource,victoriametrics-logs-datasource"

  lgtm:
    image: grafana/otel-lgtm:0.28.0
    container_name: lgtm
    restart: unless-stopped
    environment:
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
      - GF_PATHS_CONFIG=/otel-lgtm/grafana/conf/grafana.ini
      - GF_SERVER_ROOT_URL=http://diplotaxis7-dev.v212.abes.fr:3000/
      - PROMETHEUS_EXTRA_ARGS=--storage.tsdb.retention.time=30d
    volumes:
      - ./lgtm/loki/config.yml:/otel-lgtm/loki-config.yaml
      - ./lgtm/tempo/config.yml:/otel-lgtm/tempo-config.yaml
      - ./lgtm/pyroscope/config.yml:/otel-lgtm/pyroscope-config.yaml
      - ./lgtm/grafana/data:/data/grafana/data
      - ./lgtm/prometheus/data:/data/prometheus
      - ./lgtm/loki/data:/data/loki
      - ./lgtm/pyroscope/data:/data/pyroscope
      - ./lgtm/tempo/data:/data/tempo
      - ./lgtm/prometheus/prometheus.yml:/otel-lgtm/prometheus.yaml
    ports:
        - "4317:4317"
        - "4318:4318"
        - "3000:3000"
        - "9090:9090"
