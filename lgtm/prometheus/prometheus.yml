global:
  scrape_interval: 30s # Par défaut prometheus va scrapper les cibles toutes les 15 secondes
  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    env: "infrastructure" # C'est simplement le nom de votre environnement

otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    #    - cloud.availability_zone
    #    - cloud.region
    - container.name
    - deployment.environment.name
#    - k8s.cluster.name
#    - k8s.container.name
#    - k8s.cronjob.name
#    - k8s.daemonset.name
#    - k8s.deployment.name
#    - k8s.job.name
#    - k8s.namespace.name
#    - k8s.pod.name
#    - k8s.replicaset.name
#    - k8s.statefulset.name

storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m
