apiVersion: 1

datasources:
# ==========================================
  # 1. Le Backend de Metrics (VictoriaMetrics)
  # ==========================================
  - name: VictoriaMetrics
    type: victoriametrics-metrics-datasource
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true

# ==========================================
  # 2. Le Backend de Traces (Jaeger / VictoriaTraces)
  # ==========================================
  - name: VictoriaTraces
    type: jaeger
    access: proxy
    url: http://victoria-traces:10428/select/jaeger/
    editable: true
    jsonData:
      # --- Configuration du TRACE TO LOGS ---
      tracesToLogsV2:
        datasourceUid: 'VictoriaLogs' # Doit correspondre EXACTEMENT au nom ou UID de ta source de logs
        spanStartTimeShift: '-20m'
        spanEndTimeShift: '20m'
        filterByTraceID: true
        filterBySpanID: true
        customQuery: false # Reste à false si tu utilises le mode standard (décoché)

      # --- Configuration du TRACE TO METRICS ---
      tracesToMetrics:
        datasourceUid: 'VictoriaMetrics' # Doit correspondre au nom de ta source Prometheus
        spanStartTimeShift: '-20m'
        spanEndTimeShift: '20m'
        # Insertion des requêtes personnalisées de ton image_ff0fbe.png
        queries:
          - name: 'Memory usage'
            query: 'jvm.memory.used'
          - name: 'CPU usage'
            query: 'system.cpu.usage'

# ==========================================
  # 3. Le Backend de Metrics pour visualisation dans Drilldown (VictoriaMetrics)
  # ==========================================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: false

# ==========================================
  # 4. Le Backend de Logs (VictoriaLogs)
  # ==========================================
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs:9428
