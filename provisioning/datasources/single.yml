apiVersion: 1

datasources:
# ==========================================
  # 1. Le Backend de Metrics (VictoriaMetrics)
  # ==========================================
  - name: VictoriaMetrics
    type: victoriametrics-metrics-datasource
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true

# ==========================================
  # 2. Le Backend de Traces (Jaeger / VictoriaTraces)
  # ==========================================
  - name: VictoriaTraces
    type: jaeger
    access: proxy
    url: http://victoria-traces:10428/select/jaeger/
    editable: true
    jsonData:
      # --- Configuration du TRACE TO LOGS ---
      tracesToLogsV2:
        datasourceUid: 'VictoriaLogs'
        spanStartTimeShift: '-20m'
        spanEndTimeShift: '20m'
        filterByTraceID: true
        filterBySpanID: true
        customQuery: false

      # --- Configuration du TRACE TO METRICS ---
      tracesToMetrics:
        datasourceUid: 'VictoriaMetrics'
        spanStartTimeShift: '-20m'
        spanEndTimeShift: '20m'
        tags:
          - key: 'host.name'
          - key: 'container.id'
        queries:
          - name: 'Memory usage'
            query: 'jvm.memory.used{$$__tags}'
          - name: 'CPU usage'
            query: 'jvm.cpu.recent_utilization{$$__tags}'

# ==========================================
  # 3. Le Backend de Metrics pour visualisation dans Drilldown (VictoriaMetrics)
  # ==========================================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: false

# ==========================================
  # 4. Le Backend de Logs (VictoriaLogs)
  # ==========================================
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs:9428

# ==========================================
  # 5. Le Backend de Traces Tempo pour le Drilldown et service Mesh (VictoriaLogs)
  # ==========================================
  - name: VictoriaTracesTempo
    type: tempo
    access: proxy
    url: http://victoria-traces:10428/select/tempo
    isDefault: false
    editable: true
    jsonData:
      # Configuration du Service Graph
      serviceMap:
        datasourceUid: "Prometheus"
      # Configuration du Tempo Search (Filtres statiques)
      search:
        hide: false
        filters:
          - id: "service-name"
            scope: "resource"
            tag: "service.name"
            operator: "="
          - id: "span-name"
            scope: "span"
            tag: "name"
            operator: "="
      # Configuration du TracesToLogs
      tracesToLogsV2:
        datasourceUid: "VictoriaLogs"
        # Décalages temporels
        spanStartTimeShift: "-20m"
        spanEndTimeShift: "20m" 
        # Mapping des tags (spans -> logs)
        tags:
          - key: "service.name"
            value: "service.name"
          - key: "service.namespace"
            value: "service.namespace" 
        filterByTraceID: true
        filterBySpanID: true
        customQuery: false
